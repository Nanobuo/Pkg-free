name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Crea una release con questo tag (es. v1.2.0); vuoto = solo build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build executables
        run: |
          pyinstaller --noconfirm --onefile --windowed --name PkgFree --icon assets/pkgfree.png --exclude-module tkinter pkgfree_gui.py
          pyinstaller --noconfirm --onefile --console --name pkgfree-cli --icon assets/pkgfree.png --exclude-module PySide6 --exclude-module qfluentwidgets --exclude-module tkinter pkgfree_cli.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\PkgFree.exe, dist\pkgfree-cli.exe, README.md, LICENSE release\

      - uses: actions/upload-artifact@v7
        with:
          name: PkgFree-windows
          path: release/

  linux:
    # The oldest available Ubuntu: the AppImage runs on distros with this glibc or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-render-util0 libxcb-image0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build AppImage
        run: packaging/linux/build_appimage.sh

      - name: Smoke test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: dist/PkgFree-x86_64.AppImage --version

      - uses: actions/upload-artifact@v7
        with:
          name: PkgFree-linux
          path: dist/PkgFree-x86_64.AppImage

  macos:
    # Apple Silicon (arm64) runner.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Run tests
        # Native "cocoa" platform: the runner has a GUI session, and the frameless
        # Fluent window calls Cocoa APIs that crash under Qt's "offscreen" platform.
        env:
          QT_QPA_PLATFORM: cocoa
        run: python -m unittest discover -s tests -v

      - name: Build app
        run: |
          pyinstaller --noconfirm --windowed --name PkgFree --icon assets/pkgfree.png \
            --osx-bundle-identifier io.github.nanobuo.pkgfree --exclude-module tkinter pkgfree_main.py
          dist/PkgFree.app/Contents/MacOS/PkgFree --version
          # ditto keeps the bundle's symlinks and permissions intact.
          ditto -c -k --keepParent dist/PkgFree.app PkgFree-macos-arm64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: PkgFree-macos
          path: PkgFree-macos-arm64.zip

  release:
    # On a pushed v* tag, or from "Run workflow" with a release_tag (the tag is
    # then created on the commit that was built).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the program version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' pkgfree/__init__.py)
          echo "tag=$TAG version=$version"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Il tag $TAG non corrisponde alla versione $version in pkgfree/__init__.py"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        # One asset per platform/program; stable names so that
        # /releases/latest/download/<name> links keep working.
        run: |
          mkdir release
          cp artifacts/PkgFree-windows/PkgFree.exe release/PkgFree-windows-x64.exe
          cp artifacts/PkgFree-windows/pkgfree-cli.exe release/pkgfree-cli-windows-x64.exe
          cp artifacts/PkgFree-linux/PkgFree-x86_64.AppImage release/PkgFree-linux-x86_64.AppImage
          cp artifacts/PkgFree-macos/PkgFree-macos-arm64.zip release/PkgFree-macos-arm64.zip
          ls -la release

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: PKG Free ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Download

            | Sistema | File |
            |---|---|
            | Windows 10/11 (x64) | `PkgFree-windows-x64.exe` (interfaccia grafica), `pkgfree-cli-windows-x64.exe` (riga di comando) |
            | Linux (x86_64) | `PkgFree-linux-x86_64.AppImage` (grafica senza argomenti, riga di comando con argomenti) |
            | macOS (Apple Silicon) | `PkgFree-macos-arm64.zip` (contiene `PkgFree.app`) |

            ## Note

            - Supporta solo PKG **fake (fPKG)**: backup dei propri giochi e homebrew. I PKG retail del PlayStation Store non si possono estrarre.
            - **Windows:** l'eseguibile non è firmato; se compare "Windows ha protetto il PC" scegli *Ulteriori informazioni → Esegui comunque*.
            - **Linux:** `chmod +x PkgFree-linux-x86_64.AppImage` prima di avviarlo.
            - **macOS:** l'app non è firmata; al primo avvio consentila da *Impostazioni di Sistema → Privacy e sicurezza → Apri comunque*.
