name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build executables
        run: |
          pyinstaller --noconfirm --onefile --windowed --name PkgFree --icon assets/pkgfree.png --exclude-module tkinter pkgfree_gui.py
          pyinstaller --noconfirm --onefile --console --name pkgfree-cli --icon assets/pkgfree.png --exclude-module PySide6 --exclude-module qfluentwidgets --exclude-module tkinter pkgfree_cli.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\PkgFree.exe, dist\pkgfree-cli.exe, README.md, LICENSE release\

      - uses: actions/upload-artifact@v7
        with:
          name: PkgFree-windows
          path: release/

  linux:
    # The oldest available Ubuntu: the AppImage runs on distros with this glibc or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-render-util0 libxcb-image0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build AppImage
        run: packaging/linux/build_appimage.sh

      - name: Smoke test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: dist/PkgFree-x86_64.AppImage --version

      - uses: actions/upload-artifact@v7
        with:
          name: PkgFree-linux
          path: dist/PkgFree-x86_64.AppImage

  macos:
    # Apple Silicon (arm64) runner.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Run tests
        # Native "cocoa" platform: the runner has a GUI session, and the frameless
        # Fluent window calls Cocoa APIs that crash under Qt's "offscreen" platform.
        env:
          QT_QPA_PLATFORM: cocoa
        run: python -m unittest discover -s tests -v

      - name: Build app
        run: |
          pyinstaller --noconfirm --windowed --name PkgFree --icon assets/pkgfree.png \
            --osx-bundle-identifier io.github.nanobuo.pkgfree --exclude-module tkinter pkgfree_main.py
          dist/PkgFree.app/Contents/MacOS/PkgFree --version
          # ditto keeps the bundle's symlinks and permissions intact.
          ditto -c -k --keepParent dist/PkgFree.app PkgFree-macos-arm64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: PkgFree-macos
          path: PkgFree-macos-arm64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir release
          (cd artifacts/PkgFree-windows && zip -r ../../release/PkgFree-windows.zip .)
          cp artifacts/PkgFree-linux/PkgFree-x86_64.AppImage release/
          cp artifacts/PkgFree-macos/PkgFree-macos-arm64.zip release/
          ls -la release

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
