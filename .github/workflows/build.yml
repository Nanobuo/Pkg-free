name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build executables
        run: |
          pyinstaller --noconfirm --onefile --windowed --name PkgFree --exclude-module tkinter pkgfree_gui.py
          pyinstaller --noconfirm --onefile --console --name pkgfree-cli --exclude-module PySide6 --exclude-module qfluentwidgets --exclude-module tkinter pkgfree_cli.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\PkgFree.exe, dist\pkgfree-cli.exe, README.md, LICENSE release\
          Compress-Archive -Path release\* -DestinationPath PkgFree-windows.zip

      - uses: actions/upload-artifact@v7
        with:
          name: PkgFree-windows
          path: release/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: PkgFree-windows.zip
